<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111114"/>
      <stop offset="1" stop-color="#2b2350"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#4f6bff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="300" fill="#4f6bff" opacity="0.18" filter="url(#glow)"/>
  <circle cx="160" cy="640" r="260" fill="#8b7bff" opacity="0.14" filter="url(#glow)"/>

  <g transform="translate(360 190)">
    <rect width="480" height="620" rx="22" fill="#ffffff" opacity="0.04" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
    <g opacity="0.9">
      <rect x="30" y="34" width="120" height="120" rx="14" fill="url(#acc)"/>
      <rect x="30" y="176" width="420" height="26" rx="13" fill="#ffffff" opacity="0.9"/>
      <rect x="30" y="220" width="300" height="20" rx="10" fill="#ffffff" opacity="0.55"/>
      <rect x="30" y="270" width="420" height="2" fill="#ffffff" opacity="0.18"/>
      <rect x="30" y="300" width="196" height="196" rx="16" stroke="url(#acc)" stroke-width="2" fill="url(#acc)" fill-opacity="0.12"/>
      <rect x="250" y="300" width="200" height="90" rx="16" fill="#ffffff" opacity="0.08"/>
      <rect x="250" y="406" width="200" height="90" rx="16" fill="#ffffff" opacity="0.08"/>
      <circle cx="60" cy="564" r="18" fill="#8b7bff"/>
      <rect x="92" y="550" width="200" height="12" rx="6" fill="#ffffff" opacity="0.5"/>
      <rect x="92" y="572" width="140" height="10" rx="5" fill="#ffffff" opacity="0.28"/>
      <rect x="380" y="540" width="80" height="48" rx="24" fill="url(#acc)"/>
    </g>
  </g>

  <g transform="translate(150 118)">
    <rect width="176" height="70" rx="35" fill="url(#acc)" opacity="0.85"/>
    <text x="88" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="0.5">AI</text>
  </g>
  <text x="150" y="240" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" fill="#ffffff">FlyerPro AI</text>
  <text x="152" y="290" font-family="Inter, sans-serif" font-size="26" fill="#c9c4e8" letter-spacing="6">FLYER DESIGN, REIMAGINED</text>
</svg>